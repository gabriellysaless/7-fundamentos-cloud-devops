<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>FlashcardsApp</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>FlashcardsApp</h1>

    <form id="flashcard-form">
      <input type="text" id="pergunta" placeholder="Pergunta" required>
      <input type="text" id="resposta" placeholder="Resposta" required>
      <button type="submit">Adicionar Card</button>
    </form>

    <button id="btnInstall">Instalar App</button>

    <div id="flashcards"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
